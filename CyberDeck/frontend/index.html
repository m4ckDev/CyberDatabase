<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberDeck</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#000;
color:#aaa;
font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}
main{width:300px}
h1{
font-size:16px;
font-weight:400;
letter-spacing:4px;
color:#ddd;
margin:0 0 35px;
}
input{
display:block;
width:100%;
background:#000;
border:0;
border-bottom:1px solid #333;
color:#ddd;
font:14px monospace;
padding:12px 2px;
margin:15px 0;
outline:none;
}
input:focus{border-bottom-color:#777}
button{
margin-top:25px;
background:#000;
border:1px solid #333;
color:#aaa;
font:13px monospace;
padding:10px 18px;
cursor:pointer;
}
button:hover{
border-color:#777;
color:#ddd;
}
#error{
font-size:11px;
margin-top:20px;
color:#777;
}
</style>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/static/icon-192.png">

</head>
<body>

<main>
<h1>CYBERDECK</h1>

<form id="login">
<input id="username" placeholder="username" autocomplete="username" required>
<input id="password" type="password" placeholder="password" autocomplete="current-password" required>
<button type="submit">login</button>
</form>

<div id="error"></div>
</main>

<script>
document.getElementById("login").addEventListener("submit",async e=>{
e.preventDefault();

const response=await fetch("/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:document.getElementById("username").value,
password:document.getElementById("password").value
})
});

if(!response.ok){
document.getElementById("error").textContent="authentication failed";
return;
}

const data=await response.json();
sessionStorage.setItem("cyberdeck_token",data.access_token);
window.location="/dashboard";
});
</script>


<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>

</body>
</html>
